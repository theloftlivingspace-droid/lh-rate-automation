name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@latest

      - name: Write clasp credentials
        run: |
          echo "${{ secrets.CLASP_CREDENTIALS_B64 }}" | base64 -d > ~/.clasprc.json
          python3 -m json.tool ~/.clasprc.json > /dev/null && echo "credentials JSON is valid" || echo "credentials JSON is INVALID"

      - name: Push to Apps Script
        run: |
          set +e
          clasp push --force > push.log 2>&1
          echo "PUSH_EXIT_CODE=$?" >> $GITHUB_ENV
          cat push.log

      - name: Deploy new version to existing Web App (updates /exec URL in place)
        if: env.PUSH_EXIT_CODE == '0'
        env:
          DEPLOYMENT_ID: AKfycbx_z1v7FEqmthTKfZPoLsyqdIc4NJENXpfsZ315dDLzdIHwznSsOQqnG1UxkyqhOCk
        run: |
          set +e
          clasp deploy -i "$DEPLOYMENT_ID" -d "auto-deploy $(date -u +%Y-%m-%dT%H:%M:%SZ) (${GITHUB_SHA::7})" > deploy.log 2>&1
          echo "DEPLOY_EXIT_CODE=$?" >> $GITHUB_ENV
          cat deploy.log

      - name: Commit debug log on failure
        if: env.PUSH_EXIT_CODE != '0'
        run: |
          git config user.email "ci@debug.local"
          git config user.name "CI Debug"
          cp push.log debug-push-log.txt
          git add debug-push-log.txt
          git diff --staged --quiet && echo "no change in push.log, skipping commit" || git commit -m "debug: clasp push log [skip ci]"
          git fetch origin main
          git rebase origin/main
          git diff HEAD origin/main --quiet || git push origin HEAD:main

      - name: Fail if push failed
        if: env.PUSH_EXIT_CODE != '0'
        run: exit 1

      - name: Fail if deploy failed
        if: env.DEPLOY_EXIT_CODE != '0'
        run: exit 1
